name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN || github.token }}

      # Content repos → nested working dirs (work/, design/, writings/)
      - name: Checkout tech-docs → work/
        uses: actions/checkout@v5
        with:
          repository: TanyaaCJain/tech-docs
          ref: main
          token: ${{ secrets.GH_TOKEN || github.token }}
          path: work

      - name: Checkout design-docs → design/
        uses: actions/checkout@v5
        with:
          repository: TanyaaCJain/design-docs
          ref: main
          token: ${{ secrets.GH_TOKEN || github.token }}
          path: design

      - name: Checkout writings → writings/
        uses: actions/checkout@v5
        with:
          repository: TanyaaCJain/writings
          ref: main
          token: ${{ secrets.GH_TOKEN || github.token }}
          path: writings

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build website
        run: yarn build

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: yarn deploy:with-content
