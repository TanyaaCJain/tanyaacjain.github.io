name: Rebuild on Content Update

# Fired by repository_dispatch from the content repos
# (tech-docs, design-docs, writings) via their trigger workflows.
# Scheduled + manual runs act as a safety net.

on:
  repository_dispatch:
    types: [content-updated]
  schedule:
    - cron: '0 3 * * *' # daily 03:00 UTC safety-net rebuild
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build and Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Log dispatch trigger
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          echo "🔔 Dispatch from: ${{ github.event.client_payload.repository }}"
          echo "📦 Content ref: ${{ github.event.client_payload.ref }}"

      # Content repos at their latest main
      - name: Checkout tech-docs → work/
        uses: actions/checkout@v5
        with:
          repository: TanyaaCJain/tech-docs
          ref: main
          token: ${{ secrets.GH_TOKEN || github.token }}
          path: work

      - name: Checkout design-docs → design/
        uses: actions/checkout@v5
        with:
          repository: TanyaaCJain/design-docs
          ref: main
          token: ${{ secrets.GH_TOKEN || github.token }}
          path: design

      - name: Checkout writings → writings/
        uses: actions/checkout@v5
        with:
          repository: TanyaaCJain/writings
          ref: main
          token: ${{ secrets.GH_TOKEN || github.token }}
          path: writings

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build website
        run: yarn build

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: yarn deploy:with-content

      - name: Notify completion
        run: echo "✨ Website rebuilt and deployed successfully!"
